version: "3.9"
services:
  init:
    build:
      dockerfile: Dockerfile-init
    volumes:
      - shared-volume:/shared-volume
    networks:
      - graphdbnetwork


  graphdb:
    build:
      dockerfile: Dockerfile-graphdb
    ports:
      - "0:7200"
    volumes:
      - type: volume
        source: shared-volume
        target: /graphdb-project
        volume:
          subpath: graphdb-project

    container_name: "graphdb"
    networks:
      - graphdbnetwork
    depends_on:
      - init

  python:
    build:
      dockerfile: Dockerfile-python
    volumes:
      - type: volume
        source: shared-volume
        target: /graphdb-project
        volume:
          subpath: graphdb-project
    env_file:
      - vars.env
    container_name: "python"
    ports:
      - "0:8000"
    networks:
      - graphdbnetwork
    environment:
      PYTHONUNBUFFERED: 1
    depends_on:
      - init


  mysql:
    build:
      dockerfile: Dockerfile-mysql
    ports:
      - '0:3306'
    volumes:
      - type: volume
        source: shared-volume
        target: /docker-entrypoint-initdb.d
        volume:
          subpath: graphdb-project/mysql/init
      - type: volume
        source: shared-volume
        target: /docker-entrypoint-startdb.d
        volume:
          subpath: graphdb-project/mysql/start
      - type: volume
        source: shared-volume
        target: /graphdb-project
        volume:
          subpath: graphdb-project
    environment:
      - MYSQL_Database=database
      - MYSQL_ROOT_PASSWORD=root
      - BITNAMI_DEBUG=true
    stop_grace_period: 30s
    networks:
      - graphdbnetwork
    depends_on:
      - init


volumes:
  shared-volume:
    name: "shared-volume"
    external: true
  mysql:

networks:
  graphdbnetwork:
